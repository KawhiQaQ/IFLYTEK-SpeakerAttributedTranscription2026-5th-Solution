name: v16_qwen3_sortformer_offline_public_submission
description: Public offline Sortformer test candidate with the same frozen Qwen ASR, count model, and 3D-Speaker capacity fallback.
asr_source_experiment: test_asr_qwen3_1.7b
speaker_count_model: models/speaker_count/rf_v1_fold_full.joblib
speaker_count_features: reports/test_speaker_count_features_v1.json
sortformer:
  checkpoint: models/huggingface/nvidia/diar_sortformer_4spk-v1/diar_sortformer_4spk-v1.nemo
  max_speakers: 4
  device: cuda:0
  batch_size: 1
fallback_diarization:
  toolkit: modelscope/3D-Speaker
  embedding_model: iic/speech_campplus_sv_zh_en_16k-common_advanced
  vad_model: iic/speech_fsmn_vad_zh-cn-16k-common-pytorch
  device: cuda:0
assignment:
  max_gap_seconds: 0.8
  token_timestamp_source: Qwen3-ForcedAligner-0.6B
  use_predicted_arrival_slots: false
